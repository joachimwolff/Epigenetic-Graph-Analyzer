[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "epigeneticgraphanalyzer"
dynamic = ["version"]
description = "Graph analysis of promoter capture Hi-C with chromatin and expression data, validated with multi-way contact data"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Joachim Wolff", email = "wolff.joachim@mh-hannover.de"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "networkx>=2.8",
    "pyBigWig>=0.3.18",
    "matplotlib>=3.5",
    "pyliftover>=0.4",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
leiden = ["python-igraph>=0.10", "leidenalg>=0.9"]
test = ["pytest>=7"]
triggers = ["MOODS-python>=1.9.4", "pyfaidx>=0.8"]

[project.urls]
Homepage = "https://github.com/joachimwolff/Epigenetic-Graph-Analyzer"

[project.scripts]
egaCreateGraph = "epigeneticgraphanalyzer.egaCreateGraph:main"
egaIndirectContacts = "epigeneticgraphanalyzer.egaIndirectContacts:main"
egaAnnotateGraph = "epigeneticgraphanalyzer.egaAnnotateGraph:main"
egaBuildMultiway = "epigeneticgraphanalyzer.egaBuildMultiway:main"
egaValidateMultiway = "epigeneticgraphanalyzer.egaValidateMultiway:main"
egaDifferential = "epigeneticgraphanalyzer.egaDifferential:main"
egaPlotNeighbourhood = "epigeneticgraphanalyzer.egaPlotNeighbourhood:main"
egaPlotLocus = "epigeneticgraphanalyzer.egaPlotLocus:main"
egaPlotRegion = "epigeneticgraphanalyzer.egaPlotRegion:main"
egaPlotDifferential = "epigeneticgraphanalyzer.egaPlotDifferential:main"
egaExplain = "epigeneticgraphanalyzer.egaExplain:main"
egaReport = "epigeneticgraphanalyzer.egaReport:main"
egaTriggers = "epigeneticgraphanalyzer.egaTriggers:main"

[tool.setuptools.dynamic]
version = {attr = "epigeneticgraphanalyzer._version.__version__"}

[tool.setuptools.packages.find]
include = ["epigeneticgraphanalyzer*"]

[tool.setuptools.package-data]
epigeneticgraphanalyzer = ["templates/*.html", "templates/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
