# Environment of the package and of the Python analysis scripts (analysis/*.py), with the exact versions of the
# environment that produced the results of the manuscript (conda env `ega`; run_all.sh EGA_PREFIX).
#   mamba env create -f environment.yml && conda activate ega && pip install --no-deps -e .
# The external tools of the analysis drivers need incompatible Python / R versions and run in their own
# environments (envs/*.yml; run_all.sh finds them through HICEXPLORER_PREFIX, SAMTOOLS, PGT, CHASER_RSCRIPT,
# RSCRIPT and the conda env names `capchic`, `hicexplorer`, `hicdiff`, `__ucsc_kent`, `chaser`, `chicdiff`,
# `loopcallers`, `salmon`); see REPRODUCE.md for the tool versions.
name: ega
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.17
  # package
  - numpy=2.4.6
  - scipy=1.17.1
  - networkx=3.6.1
  - pybigwig=0.3.26
  - matplotlib=3.11.2
  - pyliftover=0.4.1
  - python-igraph=1.0.0
  - leidenalg=0.12.0
  - statsmodels=0.15.0
  - pytest=9.1.1
  - pip
  # the working environment holds these from PyPI (pandas 2.3.3 replaced the conda pandas 3.0.6 for pydeseq2)
  - pip:
      - pandas==2.3.3
      - scikit-learn==1.9.1
      - h5py==3.16.0
      - pydeseq2==0.5.4
      - anndata==0.12.19
