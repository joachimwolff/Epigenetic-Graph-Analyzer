# HiCUP mapping, bam2chicago and CHiCAGO (01_h1_chicago.sh, kasumi_map_runs.sh, kasumi_call_chicago.sh,
# 26_structural_variants.sh) and samtools (run_all.sh SAMTOOLS). bam2chicago.sh comes from chicagoTools
# (bitbucket.org/chicagoTeam/chicago). The Kasumi-1 scoring (kasumi_call_chicago.sh) uses the CHiCAGO tools of the
# HiCExplorer 4.0.0 C++ build (chicChicagoBackgroundModel, chicChicagoScores, chicChicagoSignificantInteractions),
# which is not part of this environment.
name: capchic
channels:
  - conda-forge
  - bioconda
dependencies:
  - hicup=0.9.2
  - bowtie2=2.5.5
  - samtools=1.24
  - r-base=4.5.3
  - bioconductor-chicago=1.38.0
  - r-data.table=1.18.6.1
